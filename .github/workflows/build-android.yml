name: Build Android APK/AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Inject AdMob App ID
        run: |
          STRINGS_FILE=android/app/src/main/res/values/strings.xml
          if [ -f "$STRINGS_FILE" ]; then
            sed -i 's|</resources>|    <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>\n</resources>|' "$STRINGS_FILE"
            echo "AdMob App ID injected:"
            grep admob_app_id "$STRINGS_FILE"
          else
            echo "strings.xml not found"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release AAB (unsigned)
        run: |
          cd android
          ./gradlew bundleRelease
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
