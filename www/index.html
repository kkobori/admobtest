<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>admobtest</title>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%;}
#canvasWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
#screen{max-width:100%;max-height:100%;width:auto;height:auto;border:none;display:block;}
#fullscreenBtn{position:fixed;top:12px;right:12px;z-index:3000;padding:8px 16px;font-size:13px;background:rgba(40,40,40,0.7);color:#fff;border:1px solid #666;border-radius:4px;cursor:pointer;font-family:monospace;opacity:0.6;}
#fullscreenBtn:hover{opacity:1;}
#fullscreenExitBtn{display:none;position:fixed;top:12px;right:12px;z-index:3000;padding:8px 16px;font-size:13px;background:rgba(40,40,40,0.85);color:#fff;border:1px solid #666;border-radius:4px;cursor:pointer;font-family:monospace;}
#canvasWrap:fullscreen #fullscreenBtn,#canvasWrap:-webkit-full-screen #fullscreenBtn{display:none;}
#canvasWrap:fullscreen #fullscreenExitBtn,#canvasWrap:-webkit-full-screen #fullscreenExitBtn{display:block;}
#startOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:5000;flex-direction:column;gap:16px;}
#startBtn{padding:16px 48px;font-size:18px;background:#356;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:monospace;}
#startBtn:hover{background:#478;}
#errBox{display:none;position:fixed;top:60px;left:16px;right:16px;color:#f88;font-family:monospace;font-size:12px;z-index:9999;background:rgba(0,0,0,0.85);padding:10px;border-radius:4px;white-space:pre-wrap;}
</style>
</head>
<body>
<div id="canvasWrap">
  <canvas id="screen" width="480" height="200" style="touch-action:none;"></canvas>
  <button id="fullscreenBtn">全画面</button>
  <button id="fullscreenExitBtn">全画面終了</button>
  <div id="hspDialogModal" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.75); z-index:2500; align-items:center; justify-content:center;">
    <div style="background:#222; padding:20px 28px; border-radius:8px; text-align:center; max-width:85%; box-shadow:0 4px 16px rgba(0,0,0,0.5);">
      <p id="hspDialogMessage" style="color:#eee; margin:0 0 16px; font-family:monospace; font-size:14px; white-space:pre-wrap;"></p>
      <button id="hspDialogOk" style="padding:10px 28px; font-size:14px; background:#356 !important; color:#fff !important; border:none; border-radius:4px; cursor:pointer; font-family:monospace; margin:0;">OK</button>
      <button id="hspDialogCancel" style="padding:10px 28px; font-size:14px; background:#555 !important; color:#fff !important; border:none; border-radius:4px; cursor:pointer; font-family:monospace; margin:0 0 0 12px; display:none;">キャンセル</button>
    </div>
  </div>
  <div id="folderPickModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#222; padding:24px 32px; border-radius:8px; text-align:center; max-width:80%; box-shadow:0 4px 16px rgba(0,0,0,0.5);">
      <p id="folderPickMessage" style="color:#eee; margin:0 0 16px; font-family:monospace; font-size:14px;">フォルダを選択してください</p>
      <button id="folderPickSelect" style="padding:10px 28px; font-size:14px; background:#356 !important; color:#fff !important; border:none; border-radius:4px; cursor:pointer; font-family:monospace; margin:0;">選択</button>
      <button id="folderPickCancel" style="padding:10px 28px; font-size:14px; background:#555 !important; color:#fff !important; border:none; border-radius:4px; cursor:pointer; font-family:monospace; margin:0 0 0 12px;">キャンセル</button>
    </div>
  </div>
  <button id="fullscreenResumeBtn" onclick="resumeFullscreenTap()" style="display:none; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2600; padding:14px 32px; font-size:15px; background:rgba(40,90,60,0.95) !important; color:#fff !important; border:1px solid #6c6; border-radius:6px; cursor:pointer; font-family:monospace;">タップして全画面に戻る</button>
</div>
<div id="errBox"></div>
<pre id="log" style="display:none"></pre>
<textarea id="src" style="display:none"></textarea>
<textarea id="resources" style="display:none"></textarea>
<div id="toastContainer" style="display:none"></div>
<div id="tabBar" style="display:none"></div>
<div id="panel-file" style="display:none"></div>
<div id="panel-code" style="display:none"></div>
<div id="panel-run" style="display:none"></div>
<div id="logHeader" style="display:none"></div>
<div id="copyStatus" style="display:none"></div>

<input type="file" id="textResourceFiles" multiple style="display:none">
<input type="file" id="binaryResourceFiles" multiple style="display:none">
<input type="file" id="audioResourceFiles" multiple style="display:none">

<script>
(function(){
  function b64ToStr(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function showErr(e){
    var d = document.getElementById("errBox");
    if (!d) return;
    d.style.display = "block";
    d.textContent = "ERROR: " + (e && e.message ? e.message : String(e)) + "\n" + (e && e.stack ? e.stack : "");
  }
  function startProgram(){
    try { runProgram(); }
    catch(e){ console.error(e); showErr(e); }
  }
  function boot(){
    try {
      var interp = b64ToStr(document.getElementById("__interp_b64__").textContent);
      var hsp = b64ToStr(document.getElementById("__hsp_b64__").textContent);
      var res = b64ToStr(document.getElementById("__res_b64__").textContent);
      var src = document.getElementById("src"); if (src) src.value = hsp;
      var rsrc = document.getElementById("resources"); if (rsrc) rsrc.value = res;
      try {
        var padMapEl = document.getElementById("__padmap_b64__");
        var padMapJson = padMapEl ? b64ToStr(padMapEl.textContent) : "";
        if (padMapJson) localStorage.setItem("hsp_gamepad_key_map", padMapJson);
      } catch(e){}
      try {
        var admobCfgEl = document.getElementById("__admob_config_b64__");
        var admobCfgJson = admobCfgEl ? b64ToStr(admobCfgEl.textContent) : "";
        if (admobCfgJson) localStorage.setItem("hsp_persist_admob_config", admobCfgJson);
      } catch(e){}
      (0, eval)(interp);
      try {
        // 生成HTMLではUI要素が存在しないため、埋め込んだ設定をlocalStorageから直接読む
        var __adRaw = localStorage.getItem("hsp_persist_admob_config");
        if (__adRaw) window.__hspAdConfig = JSON.parse(__adRaw);
        if (typeof initWebAdPlatform === "function") initWebAdPlatform();
        if (typeof initNativeAdPlatform === "function") initNativeAdPlatform();
      } catch(e) { console.warn("[広告] 生成HTML初期化失敗:", e); }
      if (location.protocol !== "https:"){
        var ov = document.createElement("div");
        ov.id = "startOverlay";
        var b = document.createElement("button");
        b.id = "startBtn";
        b.textContent = "アプリを開始";
        b.onclick = function(){ ov.parentNode.removeChild(ov); startProgram(); };
        ov.appendChild(b);
        document.body.appendChild(ov);
      } else {
        startProgram();
      }
    } catch(e){ console.error(e); showErr(e); }
  }
  try{document.getElementById("fullscreenBtn").addEventListener("click", function(){ toggleFullscreen(); });}catch(e){}
  try{document.getElementById("fullscreenExitBtn").addEventListener("click", function(){ toggleFullscreen(); });}catch(e){}
  if (document.readyState === "complete"){ setTimeout(boot, 0); }
  else { window.addEventListener("load", function(){ setTimeout(boot, 0); }); }
})();
</script>
