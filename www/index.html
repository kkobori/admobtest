<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacitor Test</title>
<style>
body { background:#fff; color:#000; font-family:sans-serif; padding:24px; }
h1 { color:#06c; }
.ok { color:#080; font-weight:bold; }
</style>
</head>
<body>
<h1>Capacitor Test</h1>
<p id="s1">HTML is loaded.</p>
<script>
document.getElementById('s1').innerHTML = '<span class="ok">Step 1: JS is working!</span>';
setTimeout(function(){
  var p = document.createElement('p');
  p.innerHTML = '<span class="ok">Step 2: setTimeout is working!</span>';
  document.body.appendChild(p);
}, 1000);
setTimeout(function(){
  var p = document.createElement('p');
  p.innerHTML = '<span class="ok">Step 3: All systems OK.</span>';
  document.body.appendChild(p);
}, 2000);
</script>
</body>
</html>
